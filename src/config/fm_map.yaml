# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket / injected "[SYSTEM]" text overrides DB delay_days
stale_policy: FM-06            # superseded or not-yet-effective clause treated as current
clause_sum: FM-04              # summing clauses instead of taking the applicable one
double_deduct: FM-05           # agent deducts a prior refund the host deducts again
sibling_refund: FM-07          # money written under another claim of the same order
denied_ignored: FM-02          # host denies (expired approval / already refunded), agent says resolved
reply_ledger_mismatch: FM-08   # reply states the quote, ledger holds the approval-capped amount
cross_principal: FM-09         # acting on / leaking another principal's order
